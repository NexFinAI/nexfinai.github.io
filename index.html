<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070a" />

    <title>Nexfin — Autonomous Intelligence for On-Chain Markets</title>
    <meta
      name="description"
      content="Nexfin builds autonomous AI agents that research on-chain markets, discover trading signals, and execute crypto strategies. An open-source research platform for on-chain trading intelligence."
    />

    <!--
      TODO(deploy): replace every `your-org` placeholder below with your GitHub
      org/username so URLs match https://<github-org>.github.io/
      Keep them in sync with src/config/site.ts
    -->
    <link rel="canonical" href="https://your-org.github.io/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexfin" />
    <meta property="og:title" content="Nexfin — Autonomous Intelligence for On-Chain Markets" />
    <meta
      property="og:description"
      content="AI agents that research on-chain markets, discover trading signals, and execute crypto strategies. Built in the open."
    />
    <meta property="og:url" content="https://your-org.github.io/" />
    <meta property="og:image" content="https://your-org.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nexfin — Autonomous Intelligence for On-Chain Markets" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexfin — Autonomous Intelligence for On-Chain Markets" />
    <meta
      name="twitter:description"
      content="AI agents that research on-chain markets, discover trading signals, and execute crypto strategies. Built in the open."
    />
    <meta name="twitter:image" content="https://your-org.github.io/og-image.png" />

    <!-- Fonts (site falls back gracefully to system fonts if these fail to load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nexfin",
        "url": "https://your-org.github.io/",
        "logo": "https://your-org.github.io/apple-touch-icon.png",
        "description": "Autonomous AI agents that research on-chain markets, discover trading signals, and execute crypto strategies.",
        "sameAs": ["https://github.com/your-org/nexfin"]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        Nexfin builds autonomous AI agents for on-chain market research, signal discovery, and
        trading. Please enable JavaScript to view this site.
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
