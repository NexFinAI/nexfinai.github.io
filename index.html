<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020604" />

    <title>NexfinAI | AI, Quantitative Finance & Crypto Research</title>
    <meta
      name="description"
      content="NexfinAI explores AI-powered quantitative research, crypto and DeFi analytics, and systematic trading systems through open-source engineering and reproducible experiments."
    />

    <!--
      TODO(deploy): replace every `your-org` placeholder below with your GitHub
      org/username so URLs match https://<github-org>.github.io/
      Keep them in sync with src/config/site.ts
    -->
    <link rel="canonical" href="https://your-org.github.io/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexfinAI" />
    <meta property="og:title" content="NexfinAI | AI, Quantitative Finance & Crypto Research" />
    <meta
      property="og:description"
      content="Intelligence for the Next Era of Finance. AI-powered quantitative research, crypto and DeFi analytics, and systematic trading systems — built through open-source engineering and reproducible experiments."
    />
    <meta property="og:url" content="https://your-org.github.io/" />
    <meta property="og:image" content="https://your-org.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NexfinAI — Intelligence for the Next Era of Finance" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexfinAI | AI, Quantitative Finance & Crypto Research" />
    <meta
      name="twitter:description"
      content="Intelligence for the Next Era of Finance. AI-powered quantitative research, crypto and DeFi analytics, and systematic trading systems — built in the open."
    />
    <meta name="twitter:image" content="https://your-org.github.io/og-image.png" />

    <!-- Fonts (site falls back gracefully to system fonts if these fail to load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NexfinAI",
        "url": "https://your-org.github.io/",
        "logo": "https://your-org.github.io/apple-touch-icon.png",
        "description": "Independent research and engineering initiative at the intersection of artificial intelligence, quantitative finance, and digital asset markets.",
        "sameAs": ["https://github.com/your-org/nexfinai"]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        NexfinAI is an independent research and engineering initiative exploring AI-powered
        quantitative research, crypto and DeFi analytics, and systematic trading systems. Please
        enable JavaScript to view this site.
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
